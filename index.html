<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
    <title>Quiz App PRO</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Bricolage+Grotesque:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="quiz-app">
      <section class="intro-card">
        <span class="eyebrow">Interactive Quiz</span>

        <h1>Quiz App PRO</h1>
        <p>
          Test your frontend knowledge with dynamic questions, score tracking
          and smooth quiz flow.
        </p>

        <div class="score-preview">
          <span>Best Mode</span>
          <strong>Focus</strong>
        </div>
      </section>

      <section class="quiz-card">
        <div class="quiz-header">
          <div>
            <span id="questionCounter" class="question-counter">
              Question 1 / 5
            </span>

            <h2 id="questionText">Which language runs in the browser?</h2>
          </div>

          <div class="score-pill">
            Score:
            <strong id="scoreValue">0</strong>
          </div>
        </div>

        <div class="progress-track">
          <div id="progressBar" class="progress-bar"></div>
        </div>

        <div id="answersContainer" class="answer-grid">
          <!-- Answers render here with JavaScript -->
        </div>

        <div class="feedback" id="feedbackText">Choose the correct answer.</div>

        <div class="quiz-actions">
          <button id="nextBtn" class="next-btn" disabled>Next Question</button>

          <button id="restartBtn" class="restart-btn hidden">
            Restart Quiz
          </button>
        </div>

        <div id="resultBox" class="result-box hidden">
          <span>Quiz Completed</span>
          <h3 id="finalScore">You scored 0 / 5</h3>
          <p id="resultMessage">Nice work. Keep practising.</p>
        </div>
      </section>
    </main>
  </body>
</html>
